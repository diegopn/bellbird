[package]
name = "bellbird"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Offline document to LaTeX converter for GNOME"
license = "GPL-3.0-or-later"

[lib]
name = "bellbird"
path = "src/lib.rs"

[[bin]]
name = "bellbird"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
pulldown-cmark = "0.13.4"
thiserror = "2.0"
gettextrs = { package = "gettext-rs", version = "0.8.0", features = ["gettext-system"] }
docling = { version = "2.13.0", default-features = false }
orgize = { version = "0.9.0", default-features = false }
parserst = { version = "0.1.1", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
