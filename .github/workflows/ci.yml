name: Rust checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: dnf install -y cargo rustfmt clippy gtk4-devel libadwaita-devel gettext
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check PO catalogs
        run: msgfmt --check po/pt_BR.po -o /tmp/bellbird-pt_BR.mo && msgfmt --check po/es.po -o /tmp/bellbird-es.mo
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test
